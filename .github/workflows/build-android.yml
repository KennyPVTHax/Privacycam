name: Build BranchCam Android Module

on:
  push:
    branches: [ main ]
    paths:
      - 'android-module/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build Debug and Release APKs
        working-directory: android-module/src/BranchCamXposed
        run: gradle :app:assembleDebug :app:assembleRelease :hook:assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BranchCam-LSPosed-Debug-APK
          path: android-module/src/BranchCamXposed/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BranchCam-LSPosed-Release-APK
          path: android-module/src/BranchCamXposed/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Hook AAR
        uses: actions/upload-artifact@v4
        with:
          name: BranchCam-Hook-AAR
          path: android-module/src/BranchCamXposed/hook/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 30
