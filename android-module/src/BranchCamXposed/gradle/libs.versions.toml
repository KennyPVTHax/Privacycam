[versions]
agp              = "8.5.2"
kotlin           = "2.0.0"
coreKtx          = "1.13.1"
appcompat        = "1.7.0"
material         = "1.12.0"
activity         = "1.9.0"
fragment         = "1.7.1"
recyclerview     = "1.3.2"
lifecycle        = "2.8.1"
coil             = "2.6.0"
xposedapi        = "82"

[libraries]
androidx-core-ktx         = { group = "androidx.core",          name = "core-ktx",         version.ref = "coreKtx" }
androidx-appcompat        = { group = "androidx.appcompat",      name = "appcompat",        version.ref = "appcompat" }
material                  = { group = "com.google.android.material", name = "material",     version.ref = "material" }
androidx-activity         = { group = "androidx.activity",       name = "activity-ktx",     version.ref = "activity" }
androidx-fragment         = { group = "androidx.fragment",       name = "fragment-ktx",     version.ref = "fragment" }
androidx-recyclerview     = { group = "androidx.recyclerview",   name = "recyclerview",     version.ref = "recyclerview" }
androidx-lifecycle-vm     = { group = "androidx.lifecycle",      name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
coil                      = { group = "io.coil-kt",              name = "coil",             version.ref = "coil" }
xposed-api                = { group = "de.robv.android.xposed",  name = "api",              version.ref = "xposedapi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library",     version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
