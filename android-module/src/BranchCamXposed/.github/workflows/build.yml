name: Build BranchCam APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1 ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # 2 ── JDK 17 ──────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3 ── Gradle cache ────────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 4 ── Make gradlew executable ─────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 5 ── Build debug APK (unsigned, no keystore needed) ─────────────────
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      # 6 ── Upload APK artifact ─────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BranchCam-LSPosed-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Optional: build release APK if signing keys are set ──────────────
      # Uncomment and add secrets KEYSTORE_BASE64, KEY_ALIAS,
      # KEY_PASSWORD, STORE_PASSWORD to enable signed release builds.
      #
      # - name: Decode keystore
      #   if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      #   run: |
      #     echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
      #
      # - name: Build release APK
      #   if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      #   run: ./gradlew :app:assembleRelease
      #   env:
      #     SIGNING_KEY_ALIAS:    ${{ secrets.KEY_ALIAS }}
      #     SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      #     SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
